version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: traceops-postgres
    restart: always
    environment:
      POSTGRES_USER: traceops
      POSTGRES_PASSWORD: traceopspassword
      POSTGRES_DB: traceops_db
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: traceops-redis
    restart: always
    ports:
      - '6379:6379'

volumes:
  pgdata: